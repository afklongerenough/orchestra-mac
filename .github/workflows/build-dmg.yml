# Builds Orchestra.app on a GitHub-hosted Mac (no Xcode needed on the user's
# MacBook) and publishes Orchestra.dmg as a workflow artifact and as the
# "latest" release asset.
#
# The app is signed with a self-signed certificate (no Apple Developer
# account) kept in the ORCHESTRA_SIGNING_P12 secret, so macOS keeps its
# permissions across builds. Clear the quarantine flag once after the
# first manual install:
#   xattr -dr com.apple.quarantine /Applications/Orchestra.app

name: Build Orchestra DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Forks don't have the signing secret; they fall back to ad-hoc signing.
      HAS_SIGNING_CERTIFICATE: ${{ secrets.ORCHESTRA_SIGNING_P12 != '' && secrets.ORCHESTRA_SIGNING_P12_PASSWORD != '' }}
      SIGNING_IDENTITY_NAME: Orchestra Self-Signed Code Signing
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # "Hey Clicky" wake word: sherpa-onnx keyword spotting (Apache-2.0) and
      # its small English KWS model, pinned by version + sha256. The app
      # builds without these too (it falls back to Apple's on-device speech).
      - name: Fetch wake-word engine and model
        run: |
          set -euo pipefail
          mkdir -p ThirdParty/sherpa && cd ThirdParty/sherpa
          curl -fsSL -o sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-osx-universal2-shared.tar.bz2
          echo "bf6718f708e15390f1da133dd888661a68df270791b178aaf765d4e3f0baa9fe  sherpa.tar.bz2" | shasum -a 256 -c
          tar xjf sherpa.tar.bz2
          mv sherpa-onnx-v2.0.1-osx-universal2-shared/include include
          mkdir -p lib
          cp sherpa-onnx-v2.0.1-osx-universal2-shared/lib/libsherpa-onnx-c-api.dylib lib/
          cp sherpa-onnx-v2.0.1-osx-universal2-shared/lib/libonnxruntime.dylib lib/
          # Apple silicon only (smaller app), and load them from the app's Frameworks folder.
          for DYLIB in lib/*.dylib; do
            lipo "$DYLIB" -thin arm64 -output "$DYLIB.arm64" 2>/dev/null && mv "$DYLIB.arm64" "$DYLIB" || true
            install_name_tool -id "@rpath/$(basename "$DYLIB")" "$DYLIB"
          done
          ONNXRUNTIME_REFERENCE=$(otool -L lib/libsherpa-onnx-c-api.dylib | awk '/libonnxruntime/ {print $1}' | head -1)
          if [ -n "$ONNXRUNTIME_REFERENCE" ] && [ "$ONNXRUNTIME_REFERENCE" != "@rpath/libonnxruntime.dylib" ]; then
            install_name_tool -change "$ONNXRUNTIME_REFERENCE" "@rpath/libonnxruntime.dylib" lib/libsherpa-onnx-c-api.dylib
          fi
          otool -L lib/libsherpa-onnx-c-api.dylib
          cat > include/module.modulemap <<'MODULEMAP'
          module SherpaOnnxC {
            header "sherpa-onnx/c-api/c-api.h"
            link "sherpa-onnx-c-api"
            export *
          }
          MODULEMAP
          curl -fsSL -o kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          echo "f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a  kws.tar.bz2" | shasum -a 256 -c
          tar xjf kws.tar.bz2
          MODEL_DIR=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          mkdir -p kws
          cp $MODEL_DIR/encoder-*-left-64.int8.onnx kws/encoder.onnx
          cp $MODEL_DIR/decoder-*-left-64.onnx kws/decoder.onnx
          cp $MODEL_DIR/joiner-*-left-64.int8.onnx kws/joiner.onnx
          cp $MODEL_DIR/tokens.txt kws/tokens.txt
          ls -la kws lib
          rm -rf sherpa.tar.bz2 kws.tar.bz2 sherpa-onnx-v2.0.1-osx-universal2-shared $MODEL_DIR

      - name: Build app (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_INCLUDE_PATHS="$PWD/ThirdParty/sherpa/include" \
            LIBRARY_SEARCH_PATHS="$PWD/ThirdParty/sherpa/lib" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Orchestra|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          # xcodebuild creates the .app folder before compiling, so check the
          # log and the real executable instead of just the folder.
          grep -q "BUILD SUCCEEDED" build.log
          test -x "build/Build/Products/Release/Orchestra.app/Contents/MacOS/Orchestra"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Signing every build with the same certificate keeps macOS permissions
      # (microphone, screen, accessibility, Keychain "Always Allow") across
      # updates, and lets the in-app updater check a download really is ours.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          SIGNING_P12_BASE64: ${{ secrets.ORCHESTRA_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.ORCHESTRA_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/orchestra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN_PATH" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          # A self-signed certificate has to be trusted for code signing on this runner.
          security find-certificate -c "$SIGNING_IDENTITY_NAME" -p "$KEYCHAIN_PATH" > "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "$SIGNING_IDENTITY_NAME" "$RUNNER_TEMP/identities.txt" || { echo "::error::signing identity not usable"; exit 1; }
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Bundle wake-word engine and model
        run: |
          APP="build/Build/Products/Release/Orchestra.app"
          mkdir -p "$APP/Contents/Frameworks" "$APP/Contents/Resources/kws"
          cp ThirdParty/sherpa/lib/*.dylib "$APP/Contents/Frameworks/"
          cp ThirdParty/sherpa/kws/* "$APP/Contents/Resources/kws/"
          echo "Orchestra links:"; otool -L "$APP/Contents/MacOS/Orchestra" | grep -E "sherpa|onnx" || echo "(no sherpa link: built without the wake-word model)"

      - name: Re-sign whole bundle
        run: |
          APP="build/Build/Products/Release/Orchestra.app"
          if [ "$HAS_SIGNING_CERTIFICATE" = "true" ]; then
            codesign --force --deep --sign "$SIGNING_IDENTITY_NAME" --keychain "$SIGNING_KEYCHAIN_PATH" \
              --timestamp=none --entitlements leanring-buddy/leanring-buddy.entitlements "$APP"
          else
            codesign --force --deep --sign - \
              --entitlements leanring-buddy/leanring-buddy.entitlements "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Designated requirement:"
          codesign -d -r- "$APP" 2>&1 | tail -1
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"

      - name: Make DMG
        run: |
          mkdir -p dmg-root
          cp -R "build/Build/Products/Release/Orchestra.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Orchestra" -srcfolder dmg-root -ov -format UDZO Orchestra.dmg
          shasum -a 256 Orchestra.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orchestra-dmg
          path: Orchestra.dmg

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Orchestra.dmg \
            --title "Orchestra build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Signed with Orchestra's own (self-signed) certificate. First install: after dragging to Applications run: xattr -dr com.apple.quarantine /Applications/Orchestra.app. Later updates: use Check for updates in the Orchestra menu." \
            --latest
